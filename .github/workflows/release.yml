name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Created once up front so the parallel matrix builds don't race to create it.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --draft --title "Akhtabooti $TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS disabled until the APPLE_* signing secrets are configured.
          # Uncomment to re-enable; the macOS-only steps below are gated on it.
          # - platform: macos-latest
          #   args: -- --locked
          - platform: ubuntu-22.04
            args: --bundles deb,rpm -- --locked
          - platform: windows-latest
            args: -- --locked
    runs-on: ${{ matrix.platform }}
    # The GraalVM native-image build of extractous's tika-native takes
    # 30+ minutes on the 3-core / 7 GB macos-latest runner.
    timeout-minutes: ${{ matrix.platform == 'macos-latest' && 120 || 60 }}
    env:
      # extractous's build script inherits this env into native-image. Its
      # deadlock watchdog (10 min of no progress) killed the build on the slow
      # macOS runner while it was still working; the job timeout is the backstop.
      NATIVE_IMAGE_OPTIONS: -H:DeadlockWatchdogInterval=0
    steps:
      - uses: actions/checkout@v7
      - name: Check Apple signing secrets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error title=Missing secret::$name is not set; the macOS bundle cannot be signed and notarized."
            done
            exit 1
          fi
          echo "All Apple signing secrets are set."

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ matrix.platform }}-

      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # Build extractous (and its ~5 GB native-image JVM) on its own first.
      # Inside the full tauri build it competes with parallel rustc jobs for
      # 7 GB of RAM, swaps, and stalls. The tauri build then reuses the output.
      - if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo build --release --locked -p extractous

      # The Tauri CLI reads the APPLE_* variables itself to sign and notarize.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/msi/*.msi \
                 "$bundle"/nsis/*.exe "$bundle"/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error title=No bundles::Nothing found under $bundle"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

      # Catches builds that run here but die at launch on any other Mac.
      - if: matrix.platform == 'macos-latest'
        run: sh src-tauri/scripts/verify-macos-bundle.sh

  provenance:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Collect the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
