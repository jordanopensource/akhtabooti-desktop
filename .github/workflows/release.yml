name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signed and notarized when the APPLE_* secrets are set, ad-hoc signed otherwise.
          - platform: macos-latest
            args: -- --locked
          - platform: ubuntu-22.04
            args: --bundles deb,rpm -- --locked
          - platform: windows-latest
            args: -- --locked
    runs-on: ${{ matrix.platform }}
    # The GraalVM native-image build of extractous's tika-native takes
    # 30+ minutes on the 3-core / 7 GB macos-latest runner.
    timeout-minutes: ${{ matrix.platform == 'macos-latest' && 120 || 60 }}
    env:
      # extractous's build script inherits this env into native-image. Its
      # deadlock watchdog (10 min of no progress) killed the build on the slow
      # macOS runner while it was still working; the job timeout is the backstop.
      NATIVE_IMAGE_OPTIONS: -H:DeadlockWatchdogInterval=0
    steps:
      - uses: actions/checkout@v7
      # All six secrets set: sign and notarize. None set: ad-hoc sign and warn.
      # Some set: fail, since that's a half-finished setup, not a choice.
      - name: Check Apple signing secrets
        id: signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All Apple signing secrets are set."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq 6 ]; then
            echo "::warning title=Unsigned macOS build::No Apple signing secrets are set; the macOS bundle will be ad-hoc signed and not notarized. Users will have to approve it in System Settings > Privacy & Security."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            for name in "${missing[@]}"; do
              echo "::error title=Missing secret::$name is not set; set all six APPLE_* secrets or none."
            done
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ matrix.platform }}-

      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # Build extractous (and its ~5 GB native-image JVM) on its own first.
      # Inside the full tauri build it competes with parallel rustc jobs for
      # 7 GB of RAM, swaps, and stalls. The tauri build then reuses the output.
      - if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo build --release --locked -p extractous

      # Two copies because an APPLE_* variable that is set but empty still makes
      # Tauri try to sign with it, so the unsigned build must not set them at all.
      - uses: tauri-apps/tauri-action@v1
        if: steps.signing.outputs.signed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "-" is ad-hoc signing on macOS; the other platforms ignore it.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Akhtabooti ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v1
        if: steps.signing.outputs.signed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Akhtabooti ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      # Catches builds that run here but die at launch on any other Mac.
      # The ad-hoc build skips the notarization and Gatekeeper checks it can't pass.
      - if: matrix.platform == 'macos-latest'
        env:
          UNSIGNED: ${{ steps.signing.outputs.signed != 'true' && '1' || '' }}
        run: sh src-tauri/scripts/verify-macos-bundle.sh src-tauri/target/release/bundle/macos/Akhtabooti.app

  provenance:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Collect the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
